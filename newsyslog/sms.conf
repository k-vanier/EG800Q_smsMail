# Rotation de /var/log/sms (journal des SMS de sms_mail.py) : chaque mois,
# 12 archives compressées. À copier dans /usr/local/etc/newsyslog.conf.d/.
# Groupe dialer : l'utilisateur du service en fait partie et peut y écrire.
# logfilename          [owner:group]   mode count size when  flags
/var/log/sms           root:dialer     660  12    *    $M1D0 J
